<!DOCTYPE html>
<html lang="th">
<head>
    <title>Khuikan-AI | เพื่อนซี้อัจฉริยะ 💬</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --main-color: #ffcc00; --accent-color: #ff9900; --bg-dark: #0b0b0b; --card-bg: #161616; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg-dark); color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        /* หน้า Login */
        #login-card { background: var(--card-bg); padding: 50px 30px; border-radius: 40px; text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.9); width: 340px; border: 2px solid #222; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .google-btn { background: #fff; color: #333; width: 100%; margin-top: 30px; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 16px; border-radius: 20px; font-weight: 600; cursor: pointer; border: none; font-size: 1.1em; transition: 0.3s; }
        .google-btn:hover { background: var(--main-color); transform: scale(1.03); }

        /* หน้า Chat */
        #app-container { display: none; width: 100%; max-width: 550px; height: 92vh; background: var(--card-bg); flex-direction: column; border-radius: 30px; position: relative; border: 1px solid #333; overflow: hidden; }
        .header { padding: 20px; background: #1f1f1f; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--main-color); }
        .status-dot { width: 10px; height: 10px; background: #00ff00; border-radius: 50%; display: inline-block; margin-right: 5px; box-shadow: 0 0 10px #00ff00; }
        
        #messages { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 18px; background: url('https://www.transparenttextures.com/patterns/dark-matter.png'); }
        .msg { padding: 14px 20px; border-radius: 22px; max-width: 85%; font-size: 1em; line-height: 1.5; position: relative; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        
        .user-msg { align-self: flex-end; background: linear-gradient(135deg, var(--main-color), var(--accent-color)); color: #000; border-bottom-right-radius: 4px; font-weight: 500; }
        .ai-msg { align-self: flex-start; background: #2a2a2a; color: #eee; border-bottom-left-radius: 4px; border-left: 5px solid var(--main-color); }
        
        .input-box { padding: 20px; background: #1f1f1f; display: flex; gap: 12px; }
        input { flex: 1; padding: 15px 20px; border-radius: 15px; border: 1px solid #444; background: #000; color: #fff; outline: none; font-size: 1em; transition: 0.3s; }
        input:focus { border-color: var(--main-color); box-shadow: 0 0 10px rgba(255, 204, 0, 0.2); }
        button#send-btn { background: var(--main-color); color: #000; border: none; padding: 0 25px; border-radius: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button#send-btn:hover { background: #fff; }

        /* Coin Section */
        .coin-box { background: #000; padding: 5px 12px; border-radius: 12px; border: 1px solid var(--main-color); }
    </style>
</head>
<body>

    <div id="login-card">
        <div style="font-size: 65px;">🤖</div>
        <h1 style="color: var(--main-color); margin: 10px 0; letter-spacing: 1px;">Khuikan-AI</h1>
        <p style="color: #aaa;">"มาคุยกันให้หายเหงาเถอะเจ้าค่ะ"</p>
        <button class="google-btn" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="22"> ล็อกอินด้วย Google
        </button>
    </div>

    <div id="app-container">
        <div class="header">
            <div>
                <span style="font-size: 0.75em; color: #888; display: block;"><span class="status-dot"></span> Online</span>
                <b id="userName" style="color: var(--main-color); font-size: 1.2em;">...</b>
            </div>
            <div style="text-align: right;">
                <div class="coin-box">🪙 <span id="coinCount" style="color: var(--main-color);">0</span></div>
                <button onclick="checkIn()" style="font-size: 0.7em; padding: 3px 8px; margin-top: 6px; background: none; color: #888; border: 1px solid #444;">รับเหรียญฟรี</button>
            </div>
        </div>
        
        <div id="messages">
            <div class="msg ai-msg">ยินดีต้อนรับสู่ <b>Khuikan-AI</b> เจ้าค่ะ! วันนี้คุณบูมอยากคุยเรื่องอะไรดีเจ้าคะ? ✨</div>
        </div>
        
        <div class="input-box">
            <input type="text" id="userInput" placeholder="พิมพ์ข้อความคุยกันที่นี่..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button id="send-btn" onclick="sendMessage()">ส่ง</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBUuxmf6LjRCinleq2-NWTuZwS7J2MnK_k",
            authDomain: "khuikan-ai.firebaseapp.com",
            projectId: "khuikan-ai",
            storageBucket: "khuikan-ai.firebasestorage.app",
            messagingSenderId: "236305769433",
            appId: "1:236305769433:web:8618ca8d4db719dda2efc8",
            measurementId: "G-ETDM24C0V1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let currentUser = null;

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });

            auth.signInWithPopup(provider).then(async (result) => {
                currentUser = result.user;
                document.getElementById('userName').innerText = currentUser.displayName;
                await setupUserDatabase();
                showApp();
            }).catch(err => {
                if (err.code === 'auth/unauthorized-domain') {
                    alert("⚠️ อย่าลืมเพิ่ม 'khuikan-ai.onrender.com' ใน Firebase Authorized Domains นะเจ้าคะ!");
                } else {
                    alert("❌ ล็อกอินขัดข้อง: " + err.message);
                }
            });
        }

        async function setupUserDatabase() {
            const userRef = db.collection("users").doc(currentUser.uid);
            const doc = await userRef.get();
            if (!doc.exists()) {
                await userRef.set({ coins: 100, lastCheckIn: "" });
            }
            updateCoinDisplay();
        }

        function updateCoinDisplay() {
            db.collection("users").doc(currentUser.uid).onSnapshot((doc) => {
                if (doc.exists()) {
                    document.getElementById('coinCount').innerText = doc.data().coins;
                }
            });
        }

        async function checkIn() {
            const now = new Date().toDateString();
            const userRef = db.collection("users").doc(currentUser.uid);
            const doc = await userRef.get();
            if (doc.data().lastCheckIn === now) return alert("วันนี้คุณบูมรับเหรียญไปแล้วนะเจ้าคะ!");
            await userRef.update({ coins: (doc.data().coins || 0) + 100, lastCheckIn: now });
            alert("ยินดีด้วยเจ้าค่ะ! ได้รับ 100 เหรียญแล้ว");
        }

        function showApp() {
            document.getElementById('login-card').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const val = input.value.trim();
            if(!val) return;

            const userRef = db.collection("users").doc(currentUser.uid);
            const doc = await userRef.get();
            if((doc.data().coins || 0) <= 0) return alert("เหรียญหมดแล้วเจ้าค่ะ!");

            appendMsg(val, "user-msg");
            input.value = '';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt: val })
                });
                const data = await response.json();
                await userRef.update({ coins: doc.data().coins - 1 });
                appendMsg(data.reply, "ai-msg");
            } catch (err) {
                appendMsg("ระบบขัดข้องนิดหน่อยเจ้าค่ะ อย่าลืมเช็ค Server หลังบ้านนะเจ้าคะ!", "ai-msg");
            }
        }

        function appendMsg(text, className) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'msg ' + className;
            div.innerText = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
