<!DOCTYPE html>
<html lang="th">
<head>
    <title>KhuiKan - Google Login & AI</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --main-color: #f1c40f; --bg-dark: #121212; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg-dark); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #login-card { background: #1e1e1e; padding: 40px; border-radius: 25px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.7); width: 320px; }
        #app-container { display: none; width: 100%; max-width: 500px; background: #1e1e1e; height: 90vh; border-radius: 20px; flex-direction: column; overflow: hidden; }
        .header { background: #2d2d2d; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--main-color); }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .input-box { padding: 15px; display: flex; gap: 10px; background: #2d2d2d; }
        input { flex: 1; padding: 12px; border-radius: 10px; border: none; background: #3d3d3d; color: white; outline: none; }
        button { background: var(--main-color); color: black; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .google-btn { background: white; color: #444; width: 100%; margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .coin-tag { color: var(--main-color); font-weight: bold; }
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 80%; line-height: 1.5; }
        .user-msg { align-self: flex-end; background: #f1c40f; color: black; border-bottom-right-radius: 2px; }
        .ai-msg { align-self: flex-start; background: #2d2d2d; border-bottom-left-radius: 2px; border-left: 3px solid #f1c40f; }
    </style>
</head>
<body>

    <div id="login-card">
        <h1 style="color: var(--main-color);">KhuiKan AI 💬</h1>
        <p>ยินดีต้อนรับคุณบูม! ล็อกอินเพื่อสะสมเหรียญกัน</p>
        <button class="google-btn" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="20"> ล็อกอินด้วย Google
        </button>
    </div>

    <div id="app-container">
        <div class="header">
            <div><b id="userName">KhuiKan AI</b></div>
            <div class="coin-tag">🪙 <span id="coinCount">0</span></div>
            <button onclick="checkIn()" style="padding: 5px 10px; font-size: 0.8em;">รับเหรียญฟรี</button>
        </div>
        <div id="messages"></div>
        <div class="input-box">
            <input type="text" id="userInput" placeholder="ถามอะไรผมก็ได้เจ้าคะ..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">ส่ง</button>
        </div>
    </div>

    <script>
        // ใช้รหัส Config ล่าสุดที่คุณส่งมาให้เลยเจ้าคะ!
        const firebaseConfig = {
            apiKey: "AIzaSyBUuxmf6LjRCinleq2-NWTuZwS7J2MnK_k",
            authDomain: "khuikan-ai.firebaseapp.com",
            projectId: "khuikan-ai",
            storageBucket: "khuikan-ai.firebasestorage.app",
            messagingSenderId: "236305769433",
            appId: "1:236305769433:web:8618ca8d4db719dda2efc8",
            measurementId: "G-ETDM24C0V1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then(async (result) => {
                currentUser = result.user;
                document.getElementById('userName').innerText = currentUser.displayName;
                await setupUserDatabase();
                showApp();
            }).catch(err => {
                console.error(err);
                alert("ล็อกอินไม่ได้: ตรวจสอบว่าเปิด Google Sign-in ใน Firebase หรือยังนะเจ้าคะ?");
            });
        }

        async function setupUserDatabase() {
            const userRef = db.collection("users").doc(currentUser.uid);
            const doc = await userRef.get();
            if (!doc.exists()) {
                await userRef.set({ coins: 100, lastCheckIn: "" });
            }
            updateCoinDisplay();
        }

        function updateCoinDisplay() {
            db.collection("users").doc(currentUser.uid).onSnapshot((doc) => {
                if (doc.exists()) {
                    document.getElementById('coinCount').innerText = doc.data().coins;
                }
            });
        }

        async function checkIn() {
            const now = new Date().toDateString();
            const userRef = db.collection("users").doc(currentUser.uid);
            const doc = await userRef.get();
            if (doc.data().lastCheckIn === now) return alert("วันนี้รับไปแล้วเจ้าคะ!");
            
            await userRef.update({ coins: doc.data().coins + 100, lastCheckIn: now });
            alert("ยินดีด้วย! ได้รับ 100 เหรียญ");
        }

        function showApp() {
            document.getElementById('login-card').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const val = input.value.trim();
            if(!val) return;

            const userRef = db.collection("users").doc(currentUser.uid);
            const doc = await userRef.get();
            if(doc.data().coins <= 0) return alert("เหรียญหมดแล้วเจ้าคะ!");

            appendMsg(val, "user-msg");
            input.value = '';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt: val })
                });
                const data = await response.json();
                
                await userRef.update({ coins: doc.data().coins - 1 });
                appendMsg(data.reply, "ai-msg");
            } catch (err) {
                appendMsg("ขออภัยเจ้าคะ ระบบขัดข้องเล็กน้อย", "ai-msg");
            }
        }

        function appendMsg(text, className) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'msg ' + className;
            div.innerText = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
