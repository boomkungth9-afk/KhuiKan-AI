<!DOCTYPE html>
<html lang="th">
<head>
    <title>Khuikan-AI | Multiverse 💬</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --main: #ffcc00; --bg: #0b0b0b; --card: #161616; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        /* หน้าเลือกตัวละคร */
        #char-selection { background: var(--card); padding: 30px; border-radius: 30px; width: 400px; border: 1px solid #333; display: none; max-height: 85vh; overflow-y: auto; }
        .char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .char-item { background: #222; padding: 15px; border-radius: 20px; cursor: pointer; transition: 0.3s; border: 2px solid transparent; text-align: center; }
        .char-item:hover { border-color: var(--main); background: #2a2a2a; transform: translateY(-5px); }
        
        /* ฟอร์มสร้างตัวละคร */
        .create-box { background: #000; padding: 20px; border-radius: 20px; margin-top: 25px; border: 1px dashed var(--main); }
        input, textarea { width: 90%; padding: 12px; margin: 8px 0; border-radius: 12px; border: 1px solid #444; background: #111; color: #fff; font-family: 'Kanit'; }

        /* หน้า Chat */
        #app-container { display: none; width: 100%; max-width: 550px; height: 95vh; background: var(--card); flex-direction: column; border-radius: 25px; border: 1px solid #222; }
        .header { padding: 15px 20px; background: #1f1f1f; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--main); border-radius: 25px 25px 0 0; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 18px; border-radius: 20px; max-width: 80%; line-height: 1.5; }
        .user-msg { align-self: flex-end; background: var(--main); color: #000; }
        .ai-msg { align-self: flex-start; background: #2a2a2a; border-left: 4px solid var(--main); }
        
        .input-box { padding: 20px; background: #1f1f1f; display: flex; gap: 10px; border-radius: 0 0 25px 25px; }
        button { background: var(--main); border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        #login-card { background: var(--card); padding: 40px; border-radius: 30px; text-align: center; border: 1px solid #333; }
    </style>
</head>
<body>

    <div id="login-card">
        <h1 style="color: var(--main);">Khuikan-AI</h1>
        <button onclick="loginWithGoogle()" style="width: 100%; padding: 15px; background: #fff; color: #000;">ล็อกอินด้วย Google</button>
    </div>

    <div id="char-selection">
        <h2 style="color: var(--main); text-align: center;">เลือกตัวละคร</h2>
        <div id="char-list" class="char-grid"></div>
        <div class="create-box">
            <h4>✨ สร้างตัวละครใหม่</h4>
            <input type="text" id="newCharName" placeholder="ชื่อตัวละคร">
            <textarea id="newCharPrompt" placeholder="บุคลิก (เช่น เป็นรุ่นพี่ใจดี)"></textarea>
            <button onclick="createNewCharacter()" style="width: 100%;">บันทึกตัวละคร</button>
        </div>
    </div>

    <div id="app-container">
        <div class="header">
            <button onclick="backToSelect()">⬅ กลับ</button>
            <div id="activeCharName" style="color: var(--main); font-weight: bold;">...</div>
            <div>🪙 <span id="coinCount">0</span></div>
        </div>
        <div id="messages"></div>
        <div class="input-box">
            <input type="text" id="userInput" placeholder="พิมพ์ข้อความ..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">ส่ง</button>
        </div>
    </div>

    <script>
        // ใช้ Firebase Config เดิมของคุณบูม
        const firebaseConfig = {
            apiKey: "AIzaSyBUuxmf6LjRCinleq2-NWTuZwS7J2MnK_k",
            authDomain: "khuikan-ai.firebaseapp.com",
            projectId: "khuikan-ai",
            storageBucket: "khuikan-ai.firebasestorage.app",
            messagingSenderId: "236305769433",
            appId: "1:236305769433:web:8618ca8d4db719dda2efc8",
            measurementId: "G-ETDM24C0V1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let currentUser = null;
        let selectedCharPrompt = "";

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then(async (result) => {
                currentUser = result.user;
                await setupUserDatabase();
                showCharSelection();
            }).catch(err => alert("เกิดข้อผิดพลาด: " + err.message));
        }

        async function setupUserDatabase() {
            const userRef = db.collection("users").doc(currentUser.uid);
            const doc = await userRef.get();
            if (!doc.exists) { // แก้ไข bug doc.exists() ตามรูป
                await userRef.set({ coins: 100 });
            }
            userRef.onSnapshot(d => { if(d.exists) document.getElementById('coinCount').innerText = d.data().coins; });
        }

        function showCharSelection() {
            document.getElementById('login-card').style.display = 'none';
            document.getElementById('app-container').style.display = 'none';
            document.getElementById('char-selection').style.display = 'block';
            loadCharacters();
        }

        async function loadCharacters() {
            const list = document.getElementById('char-list');
            list.innerHTML = "";
            const snapshot = await db.collection("characters").get();
            if (snapshot.empty) {
                await db.collection("characters").add({ name: "Khuikan-AI", prompt: "เป็น AI ผู้ช่วยที่น่ารัก" });
                return loadCharacters();
            }
            snapshot.forEach(doc => {
                const data = doc.data();
                const div = document.createElement('div');
                div.className = 'char-item';
                div.innerHTML = `<strong>${data.name}</strong>`;
                div.onclick = () => startChat(data.name, data.prompt);
                list.appendChild(div);
            });
        }

        async function createNewCharacter() {
            const name = document.getElementById('newCharName').value;
            const prompt = document.getElementById('newCharPrompt').value;
            if(!name || !prompt) return alert("กรุณากรอกข้อมูลให้ครบนะเจ้าคะ");
            await db.collection("characters").add({ name, prompt });
            alert("สร้างสำเร็จ!");
            loadCharacters();
        }

        function startChat(name, prompt) {
            selectedCharPrompt = prompt;
            document.getElementById('activeCharName').innerText = name;
            document.getElementById('char-selection').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
            document.getElementById('messages').innerHTML = `<div class="msg ai-msg">สวัสดีค่ะ ฉันคือ ${name} พร้อมคุยแล้ว!</div>`;
        }

        function backToSelect() { showCharSelection(); }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;
            appendMsg(text, "user-msg");
            input.value = "";
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt: text, systemPrompt: selectedCharPrompt })
                });
                const data = await response.json();
                appendMsg(data.reply, "ai-msg");
            } catch (err) { appendMsg("ระบบขัดข้องนิดหน่อยเจ้าค่ะ", "ai-msg"); }
        }

        function appendMsg(t, c) {
            const m = document.getElementById('messages');
            const d = document.createElement('div');
            d.className = 'msg ' + c; d.innerText = t;
            m.appendChild(d); m.scrollTop = m.scrollHeight;
        }
    </script>
</body>
</html>
