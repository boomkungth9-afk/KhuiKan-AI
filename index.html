<!DOCTYPE html>
<html lang="th">
<head>
    <title>Khuikan-AI | Multiverse 💬</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --main: #ffcc00; --bg: #0b0b0b; --card: #161616; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        #login-card, #char-selection { background: var(--card); padding: 40px 30px; border-radius: 30px; text-align: center; width: 350px; border: 1px solid #333; }
        
        /* หน้าเลือกตัวละคร */
        #char-selection { display: none; width: 450px; max-height: 80vh; overflow-y: auto; }
        .char-item { background: #222; padding: 15px; margin: 10px 0; border-radius: 15px; cursor: pointer; transition: 0.3s; border: 1px solid transparent; }
        .char-item:hover { border-color: var(--main); background: #2a2a2a; }
        
        /* สร้างตัวละคร */
        .create-box { background: #000; padding: 15px; border-radius: 15px; margin-top: 20px; border: 1px dashed var(--main); }
        input, textarea { width: 90%; padding: 10px; margin: 5px 0; border-radius: 10px; border: 1px solid #444; background: #111; color: #fff; font-family: 'Kanit'; }

        /* หน้า Chat */
        #app-container { display: none; width: 100%; max-width: 550px; height: 95vh; background: var(--card); flex-direction: column; border-radius: 25px; border: 1px solid #222; }
        .header { padding: 15px 20px; background: #1f1f1f; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--main); border-radius: 25px 25px 0 0; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 18px; border-radius: 20px; max-width: 80%; line-height: 1.5; }
        .user-msg { align-self: flex-end; background: var(--main); color: #000; }
        .ai-msg { align-self: flex-start; background: #2a2a2a; border-left: 4px solid var(--main); }
        .input-box { padding: 20px; background: #1f1f1f; display: flex; gap: 10px; border-radius: 0 0 25px 25px; }
        
        button { background: var(--main); border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .google
