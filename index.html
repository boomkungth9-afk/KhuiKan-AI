<!DOCTYPE html>
<html lang="th">
<head>
    <title>Khuikan-AI | Multiverse 💬</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --main: #ffcc00; --bg: #0b0b0b; --card: #161616; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        #login-card, #char-selection { background: var(--card); padding: 40px 30px; border-radius: 30px; text-align: center; width: 350px; border: 1px solid #333; }
        
        /* หน้าเลือกตัวละคร */
        #char-selection { display: none; width: 450px; max-height: 80vh; overflow-y: auto; }
        .char-item { background: #222; padding: 15px; margin: 10px 0; border-radius: 15px; cursor: pointer; transition: 0.3s; border: 1px solid transparent; }
        .char-item:hover { border-color: var(--main); background: #2a2a2a; }
        
        /* สร้างตัวละคร */
        .create-box { background: #000; padding: 15px; border-radius: 15px; margin-top: 20px; border: 1px dashed var(--main); }
        input, textarea { width: 90%; padding: 10px; margin: 5px 0; border-radius: 10px; border: 1px solid #444; background: #111; color: #fff; font-family: 'Kanit'; }

        /* หน้า Chat */
        #app-container { display: none; width: 100%; max-width: 550px; height: 95vh; background: var(--card); flex-direction: column; border-radius: 25px; border: 1px solid #222; }
        .header { padding: 15px 20px; background: #1f1f1f; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--main); border-radius: 25px 25px 0 0; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 18px; border-radius: 20px; max-width: 80%; line-height: 1.5; }
        .user-msg { align-self: flex-end; background: var(--main); color: #000; }
        .ai-msg { align-self: flex-start; background: #2a2a2a; border-left: 4px solid var(--main); }
        .input-box { padding: 20px; background: #1f1f1f; display: flex; gap: 10px; border-radius: 0 0 25px 25px; }
        
        button { background: var(--main); border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .google-btn { background: #fff; width: 100%; margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    </style>
</head>
<body>

    <div id="login-card">
        <h1 style="color: var(--main);">Khuikan-AI</h1>
        <p>ยินดีต้อนรับคุณบูมและเพื่อนๆ</p>
        <button class="google-btn" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="20"> ล็อกอินด้วย Google
        </button>
    </div>

    <div id="char-selection">
        <h2 style="color: var(--main);">เลือกตัวละครที่ต้องการคุย</h2>
        <div id="char-list">
            </div>
        <div class="create-box">
            <h4>+ สร้างตัวละครใหม่</h4>
            <input type="text" id="newCharName" placeholder="ชื่อตัวละคร (เช่น พี่ชายสุดเท่)">
            <textarea id="newCharPrompt" placeholder="นิสัยหรือบุคลิก (เช่น พูดจาเป็นกันเอง ชอบกวนประสาท)"></textarea>
            <button onclick="createNewCharacter()" style="width: 100%;">สร้างและบันทึก</button>
        </div>
    </div>

    <div id="app-container">
        <div class="header">
            <div>
                <button onclick="backToSelect()" style="padding: 5px 10px; font-size: 0.8em; margin-bottom: 5px;">⬅ เปลี่ยนตัว</button>
                <div id="activeCharName" style="color: var(--main); font-weight: bold;">AI Companion</div>
            </div>
            <div class="coin-display">🪙 <span id="coinCount">0</span></div>
        </div>
        <div id="messages"></div>
        <div class="input-box">
            <input type="text" id="userInput" placeholder="คุยอะไรดี..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">ส่ง</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBUuxmf6LjRCinleq2-NWTuZwS7J2MnK_k",
            authDomain: "khuikan-ai.firebaseapp.com",
            projectId: "khuikan-ai",
            storageBucket: "khuikan-ai.firebasestorage.app",
            messagingSenderId: "236305769433",
            appId: "1:236305769433:web:8618ca8d4db719dda2efc8",
            measurementId: "G-ETDM24C0V1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let currentUser = null;
        let selectedCharPrompt = "";

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then(async (result) => {
                currentUser = result.user;
                await setupUserDatabase();
                showCharSelection();
            });
        }

        async function setupUserDatabase() {
            const userRef = db.collection("users").doc(currentUser.uid);
            const doc = await userRef.get();
            if (!doc.exists) {
                await userRef.set({ coins: 100 });
            }
            db.collection("users").doc(currentUser.uid).onSnapshot(d => {
                document.getElementById('coinCount').innerText = d.data().coins;
            });
        }

        function showCharSelection() {
            document.getElementById('login-card').style.display = 'none';
            document.getElementById('app-container').style.display = 'none';
            document.getElementById('char-selection').style.display = 'block';
            loadCharacters();
        }

        async function loadCharacters() {
            const list = document.getElementById('char-list');
            list.innerHTML = "";
            const snapshot = await db.collection("characters").get();
            
            // ตัวละครเริ่มต้น
            if (snapshot.empty) {
                await db.collection("characters").add({ name: "Khuikan-AI (ดั้งเดิม)", prompt: "ตอบแบบน่ารัก สุภาพ เป็นกันเอง" });
            }

            snapshot.forEach(doc => {
                const data = doc.data();
                const div = document.createElement('div');
                div.className = 'char-item';
                div.innerHTML = `<b>${data.name}</b><br><small style="color: #888">${data.prompt.substring(0, 30)}...</small>`;
                div.onclick = () => startChat(data.name, data.prompt);
                list.appendChild(div);
            });
        }

        async function createNewCharacter() {
            const name = document.getElementById('newCharName').value;
            const prompt = document.getElementById('newCharPrompt').value;
            if(!name || !prompt) return alert("กรุณากรอกข้อมูลให้ครบนะเจ้าคะ");
            
            await db.collection("characters").add({ name, prompt });
            alert("สร้างตัวละครแล้ว!");
            loadCharacters();
        }

        function startChat(name, prompt) {
            selectedCharPrompt = prompt;
            document.getElementById('activeCharName').innerText = "คุยกับ: " + name;
            document.getElementById('char-selection').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
            document.getElementById('messages').innerHTML = `<div class="msg ai-msg">สวัสดีค่ะ ฉันคือ ${name} พร้อมคุยแล้วค่ะ!</div>`;
        }

        function backToSelect() { showCharSelection(); }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;

            appendMsg(text, "user-msg");
            input.value = "";

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        prompt: text,
                        systemPrompt: selectedCharPrompt // ส่งบุคลิกไปให้ AI
                    })
                });
                const data = await response.json();
                appendMsg(data.reply, "ai-msg");
            } catch (err) {
                appendMsg("ขออภัย ระบบขัดข้องเจ้าค่ะ", "ai-msg");
            }
        }

        function appendMsg(t, c) {
            const m = document.getElementById('messages');
            const d = document.createElement('div');
            d.className = 'msg ' + c;
            d.innerText = t;
            m.appendChild(d);
            m.scrollTop = m.scrollHeight;
        }
    </script>
</body>
</html>
