<!DOCTYPE html>
<html lang="th">
<head>
    <title>KhuiKan AI - Advanced Chat</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --main: #f1c40f; --accent: #e67e22; --bg: #0f0f0f; --card: #1a1a1a; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        /* Login Card */
        #login-card { background: var(--card); padding: 50px 30px; border-radius: 30px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 1px solid #333; width: 350px; transition: 0.5s; }
        .logo-icon { font-size: 50px; margin-bottom: 10px; }
        
        /* App Layout */
        #app-container { display: none; width: 100%; max-width: 600px; height: 95vh; background: var(--card); flex-direction: column; position: relative; border-radius: 20px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .header { padding: 20px; background: #222; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--main); border-radius: 20px 20px 0 0; }
        
        /* Chat Area */
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .msg { padding: 12px 18px; border-radius: 20px; max-width: 80%; word-wrap: break-word; font-size: 0.95em; line-height: 1.4; animation: fadeIn 0.3s; }
        .user-msg { align-self: flex-end; background: var(--main); color: black; border-bottom-right-radius: 2px; font-weight: 500; }
        .ai-msg { align-self: flex-start; background: #333; border-bottom-left-radius: 2px; border-left: 4px solid var(--main); }
        
        /* Input Area */
        .input-box { padding: 20px; background: #222; display: flex; gap: 10px; border-radius: 0 0 20px 20px; }
        input { flex: 1; padding: 15px; border-radius: 12px; border: 1px solid #444; background: #111; color: white; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--main); }
        
        button { background: var(--main); color: black; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { transform: scale(1.05); background: #ffdb4d; }
        .google-btn { background: white; color: #333; width: 100%; margin-top: 25px; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 15px; border-radius: 15px; font-size: 1em; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="login-card">
        <div class="logo-icon">💬</div>
        <h2 style="color: var(--main); margin: 0;">KhuiKan AI</h2>
        <p style="color: #888;">เพื่อนคุยอัจฉริยะ สำหรับคุณบูม</p>
        <button class="google-btn" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="22"> ล็อกอินด้วย Google
        </button>
    </div>

    <div id="app-container">
        <div class="header">
            <div>
                <span style="color: #888; font-size: 0.8em; display: block;">สวัสดีคุณ</span>
                <b id="userName" style="color: var(--main);">Guest</b>
            </div>
            <div style="text-align: right;">
                <div style="color: var(--main); font-weight: bold; font-size: 1.2em;">🪙 <span id="coinCount">0</span></div>
                <button onclick="checkIn()" style="padding: 4px 10px; font-size: 0.7em; margin-top: 5px;">รับเหรียญรายวัน</button>
            </div>
        </div>
        <div id="messages">
            <div class="msg ai-msg">สวัสดีเจ้าค่ะ มีอะไรให้ช่วยไหมเจ้าคะ? ✨</div>
        </div>
        <div class="input-box">
            <input type="text" id="userInput" placeholder="พิมพ์ข้อความที่นี่..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">ส่ง</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBUuxmf6LjRCinleq2-NWTuZwS7J2MnK_k",
            authDomain: "khuikan-ai.firebaseapp.com",
            projectId: "khuikan-ai",
            storageBucket: "khuikan-ai.firebasestorage.app",
            messagingSenderId: "236305769433",
            appId: "1:236305769433:web:8618ca8d4db719dda2efc8",
            measurementId: "G-ETDM24C0V1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let currentUser = null;

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });

            auth.signInWithPopup(provider).then(async (result) => {
                currentUser = result.user;
                document.getElementById('userName').innerText = currentUser.displayName;
                await setupUserDatabase();
                showApp();
            }).catch(err => {
                console.error("Error Detail:", err);
                if (err.code === 'auth/unauthorized-domain') {
                    alert("🚨 ล็อกอินไม่ได้: ต้องเพิ่ม 'khuikan-ai.onrender.com' ใน Authorized Domains ของ Firebase ก่อนเจ้าค่ะ!");
                } else if (err.code === 'auth/operation-not-allowed') {
                    alert("🚨 ล็อกอินไม่ได้: ยังไม่ได้กด 'Save' เพื่อเปิดใช้ Google Sign-in ใน Firebase เจ้าค่ะ!");
                } else {
                    alert("❌ เกิดข้อผิดพลาด: " + err.message);
                }
            });
        }

        async function setupUserDatabase() {
            const userRef = db.collection("users").doc(currentUser.uid);
            const doc = await userRef.get();
            if (!doc.exists()) {
                await userRef.set({ coins: 100, lastCheckIn: "" });
            }
            updateCoinDisplay();
        }

        function updateCoinDisplay() {
            db.collection("users").doc(currentUser.uid).onSnapshot((doc) => {
                if (doc.exists()) {
                    document.getElementById('coinCount').innerText = doc.data().coins;
                }
            });
        }

        async function checkIn() {
            const now = new Date().toDateString();
            const userRef = db.collection("users").doc(currentUser.uid);
            const doc = await userRef.get();
            if (doc.data().lastCheckIn === now) return alert("วันนี้คุณรับเหรียญไปแล้วนะเจ้าคะ!");
            
            await userRef.update({ coins: (doc.data().coins || 0) + 100, lastCheckIn: now });
            alert("ยินดีด้วย! ได้รับเพิ่ม 100 เหรียญเจ้าค่ะ");
        }

        function showApp() {
            document.getElementById('login-card').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('login-card').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
            }, 500);
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const val = input.value.trim();
            if(!val) return;

            const userRef = db.collection("users").doc(currentUser.uid);
            const doc = await userRef.get();
            if((doc.data().coins || 0) <= 0) return alert("เหรียญหมดแล้วเจ้าค่ะ กรุณากดรับเหรียญฟรีนะเจ้าคะ");

            appendMsg(val, "user-msg");
            input.value = '';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt: val })
                });
                const data = await response.json();
                
                await userRef.update({ coins: doc.data().coins - 1 });
                appendMsg(data.reply, "ai-msg");
            } catch (err) {
                appendMsg("ขออภัยเจ้าค่ะ ตอนนี้ระบบ AI ขัดข้องเล็กน้อย (อย่าลืมเปิด Server หลังบ้านนะเจ้าคะ)", "ai-msg");
            }
        }

        function appendMsg(text, className) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'msg ' + className;
            div.innerText = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
